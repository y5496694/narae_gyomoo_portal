name: Authorized final actions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  final-actions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p test_final.py -v
      - run: node tests/test_actions.cjs
